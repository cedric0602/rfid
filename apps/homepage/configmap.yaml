apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: default
data:
  settings.yaml: |
    title: "Mon Serveur Asus plop"
    background: https://unsplash.com
    theme: dark
    # RECORRECTION ICI : On dit à Homepage d'afficher les widgets dans le bandeau du haut (header)
    header:
      showOptionalWidgets: true
    layout:
      Infrastructure:
        style: columns
        columns: 1
      Outils:
        style: columns
        columns: 3

  widgets.yaml: |
    - logo:
        icon: si-asus
    - datetime:
        format:
          date: "dd LLL yyyy"
          time: "HH:mm"
          hour12: false
    # Utilisation du fournisseur natif 'weather' qui est plus stable avec la géolocalisation
    - weather:
        label: "Lévis"
        latitude: 46.81
        longitude: -71.20
        units: metric
        cache: 15
    - resources:
        cpu: true
        memory: true
        disk: /
        uptime: true

  services.yaml: |
    - Infrastructure:
        - Kubernetes Cluster:
            icon: si-kubernetes
            href: http://192.168.2.136:30080
            description: "Statut du cluster MicroK8s"
            widget:
              type: kubernetes
              url: http://192.168.2.136:30080

    - Outils:
        - GitHub Repository:
            icon: si-github
            href: https://github.com
            description: "Mon code source et mes fichiers YAML"
        - Grafana Monitoring:
            icon: si-grafana
            href: http://192.168.2.136:30090
            description: "Suivi et métriques de mon serveur"
            # Configuration validée pour afficher la température sans virgule
            widget:
              type: prometheusmetric
              url: http://prometheus-service:9090
              metrics:
                - label: "Temp. CPU"
                  query: "round(avg(node_hwmon_temp_celsius))"
                  suffix: "°C"
        - Monero Mining Pool:
            icon: si-monero
            href: https://supportxmr.com
            description: "Suivi des gains et du hashrate de l'Asus"

  bookmarks.yaml: |
    - Favoris:
        - Google:
            - href: https://google.com
              icon: si-google
