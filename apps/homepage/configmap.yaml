apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: default
data:
  settings.yaml: |
    title: "Mon Serveur Asus plop"
    background: https://unsplash.com
    theme: dark
    layout:
      Infrastructure:
        style: columns
        columns: 1
      Outils:
        style: columns
        columns: 3

  # --- NOUVEAU : Bloc des sondes globales du haut de page ---
  widgets.yaml: |
    - logo:
        icon: si-asus
    - datetime:
        format:
          date: "dd LLL yyyy"
          time: "HH:mm"
          hour12: false
    # Sonde météo sans clé API requise
    - openmeteo:
        label: "Météo Maison"
        latitude: 46.81  # À ajuster selon tes coordonnées (ex: Québec)
        longitude: -71.20
        units: metric
    # Sondes matérielles (en plus de ta CPU/RAM actuelle)
    - resources:
        cpu: true
        memory: true
        disk: /          # Surveille l'espace de la racine
        uptime: true     # Depuis quand l'Asus tourne

  services.yaml: |
    - Infrastructure:
        - Kubernetes Cluster:
            icon: si-kubernetes
            href: http://192.168.2.136:30080
            description: "Statut du cluster MicroK8s"
            # Widget Kubernetes officiel de Homepage
            widget:
              type: kubernetes
              url: http://192.168.2.136:30080
              # Optionnel : si ton cluster requiert un token, il se configure ici

    - Outils:
        - GitHub Repository:
            icon: si-github
            href: https://github.com
            description: "Mon code source et mes fichiers YAML"
        - Grafana Monitoring:
            icon: si-grafana
            href: http://192.168.2.136:30090
            description: "Suivi et métriques de mon serveur"
        - Monero Mining Pool:
            icon: si-monero
            href: https://supportxmr.com
            description: "Suivi des gains et du hashrate de l'Asus"

  bookmarks.yaml: |
    - Favoris:
        - Google:
            - href: https://google.com
              icon: si-google
