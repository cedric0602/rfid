apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: default
data:
  settings.yaml: |
    title: "Mon Serveur Asus plop"
    # Utilise une vraie image Unsplash de background (ici une vue abstraite de serveur/tech)
    background: https://unsplash.com
    theme: dark
    # Amélioration de la mise en page (grille compacte et élégante)
    layout:
      Infrastructure:
        style: columns
        columns: 1
      Outils:
        style: columns
        columns: 3

  services.yaml: |
    - Infrastructure:
        - Kubernetes Cluster:
            # Utilisation de l'API d'icônes intégrée (plus propre que les .svg locaux manquants)
            icon: si-kubernetes
            href: http://192.168.2.136:30080
            description: "Statut du cluster MicroK8s"
            # Intégration du widget natif Kubernetes pour afficher l'état du cluster en direct
            widget:
              type: kubernetes
              url: http://192.168.2.136:30080

    - Outils:
        - GitHub Repository:
            icon: si-github
            href: https://github.com
            description: "Mon code source et mes fichiers YAML"
        - Grafana Monitoring:
            icon: si-grafana
            href: http://192.168.2.136:30090
            description: "Suivi et métriques de mon serveur"
            # Widget Grafana optionnel pour l'état de l'app si configuré
        - Monero Mining Pool:
            icon: si-monero
            href: https://supportxmr.com
            description: "Suivi des gains et du hashrate de l'Asus"

  bookmarks.yaml: |
    - Favoris:
        - Google:
            - href: https://google.com
              icon: si-google
