apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: default
data:
  settings.yaml: |
    title: "Mon Serveur Asus plop"
    background:
      image: https://unsplash.com
    theme: dark
  
  # ... (votre bloc settings reste identique)
  services.yaml: |
    - Infrastructure:
        - Kubernetes Cluster:
            icon: kubernetes.svg
            href: http://192.168.2.136:30080
            description: "Statut du cluster MicroK8s cedric"
            
    - Outils:
        - GitHub Repository:
            icon: github.svg
            href: https://github.com
            description: "Mon code source et mes fichiers YAML"
        - Grafana Monitoring:
            icon: grafana.svg
            href: http://192.168.2.136:30090
            description: "Suivi et métriques de mon serveur"
        - Monero Mining Pool:
            icon: monero.svg
            href: https://supportxmr.com
            description: "Suivi des gains et du hashrate de l'Asus"

  bookmarks.yaml: |
    - Favoris:
        - Google:
            - href: https://google.com
