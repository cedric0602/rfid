apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: default
data:
  settings.yaml: |
    title: "Mon Serveur Asus plop"
    background: https://unsplash.com
    theme: dark
    layout:
      Infrastructure:
        style: columns
        columns: 1
      Outils:
        style: columns
        columns: 3

  widgets.yaml: |
    - logo:
        icon: si-asus
    - datetime:
        format:
          date: "dd LLL yyyy"
          time: "HH:mm"
          hour12: false
    - openmeteo:
        label: "Météo Maison"
        latitude: 46.81
        longitude: -71.20
        units: metric
    - resources:
        cpu: true
        memory: true
        disk: /
        uptime: true

  services.yaml: |
    - Infrastructure:
        - Kubernetes Cluster:
            icon: si-kubernetes
            href: http://192.168.2.136:30080
            description: "Statut du cluster MicroK8s"
            widget:
              type: kubernetes
              url: http://192.168.2.136:30080

    - Outils:
        - GitHub Repository:
            icon: si-github
            href: https://github.com
            description: "Mon code source et mes fichiers YAML"
        - Grafana Monitoring:
            icon: si-grafana
            href: http://192.168.2.136:30090
            description: "Suivi et métriques de mon serveur"
            # AJOUT DU WIDGET ICI : 
            widget:
              type: prometheusmetric
              url: http://prometheus-service:9090
              metrics:
                - label: "Temp. CPU"
                  query: "scalar(round(node_hwmon_temp_celsius))"
                  suffix: "°C"
                - label: "Conso CPU"
                  query: "scalar(round(rate(node_rapl_package_joules_total[5m])))"
                  suffix: " W"
        - Monero Mining Pool:
            icon: si-monero
            href: https://supportxmr.com
            description: "Suivi des gains et du hashrate de l'Asus"

  bookmarks.yaml: |
    - Favoris:
        - Google:
            - href: https://google.com
              icon: si-google
