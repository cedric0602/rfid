apiVersion: apps/v1
kind: Deployment
metadata:
  name: xmrig-miner-asus
  labels:
    app: xmrig
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: xmrig-asus
  template:
    metadata:
      labels:
        app: xmrig-asus
    spec:
      nodeName: csiaoh
      containers:
      - name: xmrig
        image: xmrig/xmrig:latest
        args:
        - "--url=pool.supportxmr.com:443"
        - "--user=41w7BeBLFZ5XrYuG4wSDjDED65RV5xgph5JEfFmnHYtBSXz6cdUSHxcFjPYudyME5x8bH9eAiAxob4MCMzktjSmRFJA6zpL"
        - "--rig-id=serveur-asus"
        - "--donate-level=1"
        - "--tls"
        resources:
          limits:
            cpu: "1.5"
            memory: "2Gi"
          requests:
            cpu: "0.2"      # Demande très peu pour être sûr que le pod démarre
            memory: "250Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xmrig-miner-vm
  labels:
    app: xmrig
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: xmrig-vm
  template:
    metadata:
      labels:
        app: xmrig-vm
    spec:
      nodeName: vmubuntu
      containers:
      - name: xmrig
        image: xmrig/xmrig:latest
        args:
        - "--url=pool.supportxmr.com:443"
        - "--user=41w7BeBLFZ5XrYuG4wSDjDED65RV5xgph5JEfFmnHYtBSXz6cdUSHxcFjPYudyME5x8bH9eAiAxob4MCMzktjSmRFJA6zpL"
        - "--rig-id=vm-ubuntu"
        - "--donate-level=1"
        - "--tls"
        resources:
          limits:
            cpu: "2.0"      # Permet à la VM d'utiliser ses 2 cœurs à fond
            memory: "2Gi"
          requests:
            cpu: "0.2"      # Permet au pod de s'installer sans bloquer le CPU
            memory: "250Mi"
