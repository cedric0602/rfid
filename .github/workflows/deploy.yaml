name: CI/CD Auto-Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Déployer toutes les applications sur Kubernetes
        run: |
          microk8s kubectl apply -R -f apps/
          microk8s kubectl rollout restart deployment homepage-deployment
