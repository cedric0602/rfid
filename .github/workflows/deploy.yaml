name: CI/CD Auto-Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Un seul deploiement a la fois
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Valider les manifests (build Kustomize + dry-run)
        run: |
          microk8s kubectl kustomize overlays/home > "$RUNNER_TEMP/rendered.yaml"
          microk8s kubectl apply --dry-run=client -f "$RUNNER_TEMP/rendered.yaml"

      - name: Déployer sur Kubernetes
        run: microk8s kubectl apply -k overlays/home

      # Uniquement les Deployments (epingles sur le master).
      # Les DaemonSets sont exclus : si la VM est eteinte, leur rollout
      # ne se terminerait jamais et le CI echouerait chaque semaine.
      - name: Vérifier que les déploiements sont prêts
        run: |
          for d in prometheus-deployment grafana-deployment homepage-deployment; do
            microk8s kubectl rollout status deployment/$d --timeout=180s
          done