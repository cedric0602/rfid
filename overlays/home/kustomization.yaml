apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/priority
  - ../../base/monitoring
  - ../../base/homepage
  - ../../base/miner
  - ../../base/immich

# Variables communes (IP, pool, wallet) -> ConfigMap "cluster-vars".
# Kustomize ajoute un hash au nom : changer vars.env redemarre les pods concernes.
# Immich EN PAUSE (0 pod). Photos et base restent sur les PVC, rien n'est perdu.
# Pour le relancer : supprimer ce bloc "replicas" (ou mettre count: 1) puis push.
replicas:
  - name: immich-server
    count: 0
  - name: immich-machine-learning
    count: 0
  - name: immich-redis
    count: 0
  - name: immich-postgres
    count: 0

configMapGenerator:
  - name: cluster-vars
    envs:
      - vars.env

# Versions d'images centralisees ici (les manifests de base n'ont pas de tag).
# Mises a jour securite du 2026-11-24.
images:
  - name: grafana/grafana
    newTag: "12.4.16"
  - name: prom/prometheus
    newTag: "v3.16.0"
  - name: prom/node-exporter
    newTag: "v1.13.1"
  - name: ghcr.io/gethomepage/homepage
    newTag: "v2.8.0"
  # Immich : server et machine-learning TOUJOURS a la meme version.
  # (postgres et valkey sont figes dans base/immich, selon le compose officiel)
  - name: ghcr.io/immich-app/immich-server
    newTag: "v3.4.2"
  - name: ghcr.io/immich-app/immich-machine-learning
    newTag: "v3.4.2"
  - name: xmrig/xmrig
    newTag: "6.26.0"


