# Remplace les Deployments xmrig-miner-asus / xmrig-miner-vm.
# Plus de nodeName : le mineur tourne sur les noeuds portant le label
#   miner=light  -> le master (1 thread, pour garder le laptop reactif)
#   miner=full   -> la VM (4 threads sur 4 vCPU)
# Quand la VM s'eteint puis revient, le pod repart tout seul.
# Pool, wallet : overlays/home/vars.env. rig-id = nom du noeud.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: xmrig-light
  labels:
    app: xmrig
spec:
  selector:
    matchLabels:
      app: xmrig
      profile: light
  # Equivalent de l'ancien "Recreate" : l'ancien pod est supprime avant le nouveau
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: xmrig
        profile: light
    spec:
      priorityClassName: miner
      terminationGracePeriodSeconds: 15
      nodeSelector:
        miner: light
      containers:
      - name: xmrig
        image: xmrig/xmrig
        securityContext:
          privileged: true   # utile pour l'acces MSR (boost hashrate) ; a tester sans
        command: ["xmrig"]
        args:
        - "-o"
        - "$(XMR_POOL)"
        - "-u"
        - "$(XMR_WALLET)"
        - "--rig-id"
        - "$(NODE_NAME)"
        - "--donate-level"
        - "1"
        - "--tls"
        - "--keepalive"   # evite les deconnexions "end of file" du pool
        - "--cpu-priority"
        - "1"
        - "-t"
        - "1"
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: XMR_POOL
          valueFrom:
            configMapKeyRef:
              name: cluster-vars
              key: XMR_POOL
        - name: XMR_WALLET
          valueFrom:
            configMapKeyRef:
              name: cluster-vars
              key: XMR_WALLET
        resources:
          limits:
            cpu: "1.8"
            memory: "4Gi"
            hugepages-2Mi: "2560Mi"
          requests:
            cpu: "0.2"
            # Le dataset RandomX (~2 Go) est dans les hugepages, pas dans "memory"
            memory: "512Mi"
            hugepages-2Mi: "2560Mi"
        volumeMounts:
        - mountPath: /dev/hugepages
          name: hugepages
      volumes:
      - name: hugepages
        emptyDir:
          medium: HugePages
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: xmrig-full
  labels:
    app: xmrig
spec:
  selector:
    matchLabels:
      app: xmrig
      profile: full
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: xmrig
        profile: full
    spec:
      priorityClassName: miner
      terminationGracePeriodSeconds: 15
      nodeSelector:
        miner: full
      containers:
      - name: xmrig
        image: xmrig/xmrig
        securityContext:
          privileged: true
        command: ["xmrig"]
        args:
        - "-o"
        - "$(XMR_POOL)"
        - "-u"
        - "$(XMR_WALLET)"
        - "--rig-id"
        - "$(NODE_NAME)"
        - "--donate-level"
        - "1"
        - "--tls"
        - "--keepalive"   # evite les deconnexions "end of file" du pool
        - "--cpu-priority"
        - "1"
        - "-t"
        - "4"
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: XMR_POOL
          valueFrom:
            configMapKeyRef:
              name: cluster-vars
              key: XMR_POOL
        - name: XMR_WALLET
          valueFrom:
            configMapKeyRef:
              name: cluster-vars
              key: XMR_WALLET
        resources:
          limits:
            # = nombre de threads (-t). Une limite plus basse bride xmrig (throttling CFS).
            # Le systeme reste prioritaire grace a --cpu-priority 1 et a la PriorityClass.
            cpu: "4"
            memory: "4Gi"
            hugepages-2Mi: "2560Mi"
          requests:
            cpu: "0.2"
            memory: "512Mi"
            hugepages-2Mi: "2560Mi"
        volumeMounts:
        - mountPath: /dev/hugepages
          name: hugepages
      volumes:
      - name: hugepages
        emptyDir:
          medium: HugePages
