apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-deployment
  labels:
    app: prometheus
spec:
  replicas: 1
  # Recreate : le volume est RWO et Prometheus verrouille sa base
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      priorityClassName: monitoring
      # Reste sur le master (qui ne s'arrete pas), la ou vivent les donnees
      nodeSelector:
        homelab/role: master
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
      - name: prometheus
        image: prom/prometheus
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=15d
        - --storage.tsdb.retention.size=4GB
        - --web.enable-lifecycle
        ports:
        - containerPort: 9090
        # Laisse jusqu'a 5 min pour relire le WAL apres un redemarrage
        startupProbe:
          httpGet:
            path: /-/ready
            port: 9090
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9090
          periodSeconds: 20
          failureThreshold: 3
        volumeMounts:
        - name: config-volume
          mountPath: /etc/prometheus/prometheus.yml
          subPath: prometheus.yml
        - name: data
          mountPath: /prometheus
        resources:
          limits:
            cpu: "0.5"
            memory: "1Gi"
          requests:
            cpu: "0.1"
            memory: "256Mi"
      volumes:
      - name: config-volume
        configMap:
          name: prometheus-server-conf
      - name: data
        persistentVolumeClaim:
          claimName: prometheus-data
