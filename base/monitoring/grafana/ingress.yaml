# Inchange volontairement (NodePort 30090 + Ingress). Tu peux plus tard garder
# un seul des deux acces.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
spec:
  ingressClassName: public   # classe de l'addon "ingress" (nginx) de MicroK8s
  rules:
  - host: grafana.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana-service
            port:
              number: 80

