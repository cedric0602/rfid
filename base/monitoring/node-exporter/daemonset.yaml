# Un node-exporter par noeud (master + VM). Remplace l'ancien Deployment
# epingle sur le master, qui ne surveillait pas la VM.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  labels:
    app: node-exporter
spec:
  selector:
    matchLabels:
      app: node-exporter
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      priorityClassName: monitoring
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
      - operator: Exists
      containers:
      - name: node-exporter
        image: prom/node-exporter
        args:
        - --path.rootfs=/host
        - --web.listen-address=:9100
        ports:
        - containerPort: 9100
        resources:
          limits:
            cpu: "0.1"
            memory: "128Mi"
          requests:
            cpu: "0.02"
            memory: "32Mi"
        volumeMounts:
        - name: root
          mountPath: /host
          readOnly: true
          mountPropagation: HostToContainer
      volumes:
      - name: root
        hostPath:
          path: /

