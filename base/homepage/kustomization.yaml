apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Les 5 fichiers de config sont generes en ConfigMap avec hash.
configMapGenerator:
  - name: homepage-config
    files:
      - config/settings.yaml
      - config/widgets.yaml
      - config/services.yaml
      - config/bookmarks.yaml
      - config/kubernetes.yaml
      - config/custom.css
      - config/custom.js