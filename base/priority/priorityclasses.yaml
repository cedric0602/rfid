# Le monitoring passe toujours avant le mineur.
# Si le laptop manque de ressources, c'est xmrig qui est sacrifie en premier.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: monitoring
value: 100000
globalDefault: false
description: "Monitoring et dashboards : prioritaires"
---
# Applications (Immich...) : passent apres le monitoring mais avant le mineur.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: apps
value: 10000
globalDefault: false
description: "Applications du homelab : avant le mineur, apres le monitoring"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: miner
value: 1000
preemptionPolicy: Never
globalDefault: false
description: "Mineur xmrig : basse priorite, ne preempte jamais les autres pods"