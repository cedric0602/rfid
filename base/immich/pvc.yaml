# Photos et videos (dossier /data d'Immich).
# Plus tard, avec le NAS : remplacer ce PVC par un volume NFS du NAS
# (seulement celui-ci : la base de donnees doit rester en local).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: microk8s-hostpath
  resources:
    requests:
      storage: 20Gi
---
# Base PostgreSQL. Jamais sur un partage reseau (pas supporte par Immich).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-db
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: microk8s-hostpath
  resources:
    requests:
      storage: 5Gi
